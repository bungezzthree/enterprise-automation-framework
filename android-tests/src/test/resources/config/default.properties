# Project identity, as shown on the quality dashboard
project.key=ANDROID-SWAGLABS
project.name=Swag Labs Android App
project.type=MOBILE
project.description=Pilot: end-to-end journeys (login, catalog, cart, checkout) on the Sauce Labs sample Android app

testcases.catalog=testcases/catalog.csv

# ---- Where to run -------------------------------------------------------------------------------------------
# mobile.mode is chosen by the Maven profile (-Pemulator | -Pheadless | -Pdevice | -Premote) or -Dmobile.mode=...
#   emulator  AVD with a window; started if it is not running, stopped afterwards
#   headless  the same AVD without a window (CI, background runs)
#   device    a physical phone (USB or Wi-Fi debugging); auto-selected when only one is connected
#   remote    device farm / remote Appium server; no local device handling
mobile.platform=android
# AVD used by emulator and headless mode (Android Studio > Device Manager). See docs/android-setup.md
android.avd=eaf_pixel
# Serial from 'adb devices' when several devices are connected (or to run on an emulator that is already up):
# android.udid=R58M12345XYZ
# Leave empty to find the SDK from ANDROID_HOME / ANDROID_SDK_ROOT / the Android Studio default folder
# android.sdk.root=

# Appium: 'auto' starts a local server when none answers at the URL, 'external' never does
appium.server.url=http://127.0.0.1:4723
appium.server.mode=auto

# ---- App under test -----------------------------------------------------------------------------------------
# Path or URL of the .apk. A URL is downloaded by Appium; use a local path to avoid downloading on every run.
mobile.app=https://github.com/saucelabs/sample-app-mobile/releases/download/2.7.1/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk
mobile.app.package=com.swaglabsmobileapp
mobile.app.activity=com.swaglabsmobileapp.SplashActivity
mobile.app.wait.activity=com.swaglabsmobileapp.*

# ---- Behaviour ----------------------------------------------------------------------------------------------
# Explicit wait for every element, in milliseconds
mobile.timeout.ms=20000
# run: one Appium session for all scenarios (fast); scenario: a fresh session for each one
mobile.session.scope=run
# Attach a screen recording to failed scenarios (evidence.mode=all: to every scenario)
mobile.record.video=false
# Any other Appium capability: mobile.cap.<name>=<value>, for example:
# mobile.cap.language=en

# Public demo accounts of the sample app
mobile.user.standard=standard_user
mobile.user.locked=locked_out_user
mobile.user.password=secret_sauce

# ---- TestDesk (UAT and test evidence tool). Off by default; enable with -Dtestdesk.enabled=true ---------------
testdesk.enabled=false
testdesk.url=http://localhost:3100
testdesk.project=AND
testdesk.environment=SIT
testdesk.suite.root=
# evidence.mode: none | failed | all (screenshots; failed scenarios also get the UI hierarchy and logcat)
evidence.mode=failed
