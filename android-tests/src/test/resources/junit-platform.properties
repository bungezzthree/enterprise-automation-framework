cucumber.glue=com.enterprise.qa.core.steps.mobile,com.enterprise.qa.android
cucumber.plugin=pretty, summary, \
  html:target/cucumber-reports/cucumber.html, \
  json:target/cucumber-reports/cucumber.json, \
  junit:target/cucumber-reports/cucumber.xml, \
  com.enterprise.qa.core.reporting.DbResultPublisher, \
  com.enterprise.qa.core.testdesk.TestDeskResultListener
cucumber.publish.quiet=true
# One emulator or phone runs one scenario at a time.
cucumber.execution.parallel.enabled=false
