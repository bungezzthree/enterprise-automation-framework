# Project identity, as shown on the quality dashboard
project.key=WEB-SAUCEDEMO
project.name=Sauce Demo Web Store
project.type=WEB
project.description=Pilot: end-to-end UI journeys (login, catalog, cart, checkout) on saucedemo.com

testcases.catalog=testcases/catalog.csv

# Engine: playwright | selenium ; browser: chromium | chrome | firefox | webkit | edge
web.engine=playwright
browser=chromium
headless=true
web.base.url=https://www.saucedemo.com
web.timeout.ms=10000
# Page navigation waits for DOMContentLoaded only; this caps slow networks
web.navigation.timeout.ms=30000

# Public demo accounts published on the saucedemo.com login page
web.user.standard=standard_user
web.user.locked=locked_out_user
web.user.password=secret_sauce

# TestDesk (UAT and test evidence tool). Off by default so local runs do not create plans.
# Enable with -Dtestdesk.enabled=true. The API token is read from the TESTDESK_TOKEN environment variable.
testdesk.enabled=false
testdesk.url=http://localhost:3100
testdesk.project=WEB
testdesk.environment=SIT
# evidence.mode: none | failed | all (screenshots, API request/response)
evidence.mode=failed
