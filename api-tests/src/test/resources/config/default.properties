# Project identity, as shown on the quality dashboard
project.key=API-JSONPLACEHOLDER
project.name=JSONPlaceholder REST API
project.type=API
project.description=Pilot: contract verification of the public JSONPlaceholder API (posts, comments, users)

# Full inventory (manual + automated), mirrors the TestDesk test suite export
testcases.catalog=testcases/catalog.csv

api.base.url=https://jsonplaceholder.typicode.com
api.timeout.ms=15000
api.log.all=false

# TestDesk (UAT and test evidence tool). Off by default so local runs do not create plans.
# Enable with -Dtestdesk.enabled=true. The API token is read from the TESTDESK_TOKEN environment variable.
testdesk.enabled=false
testdesk.url=http://localhost:3100
testdesk.project=API
testdesk.environment=SIT
# Optional folder above the module suites in Test Specification. Empty: test cases go straight into their module suite
# (named after the feature file). Execution Type already says whether a test case is automated.
testdesk.suite.root=
# evidence.mode: none | failed | all (screenshots, API request/response)
evidence.mode=failed
